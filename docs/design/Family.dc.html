<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>고른 눈으로 본 사진 결과</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&amp;display=swap">
<style>
body{margin:0;font-family:"Noto Sans KR",system-ui,sans-serif}
a{color:#191F28;text-decoration:none}a:hover{color:#2272EB}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #191F28; display: flex; flex-direction: column; font-family: 'Noto Sans KR', system-ui, sans-serif; overflow: hidden; position: relative">

  <div aria-label="토스 제공 내비게이션 바" style="height: 52px; padding: 0 12px 0 8px; display: flex; align-items: center; gap: 8px; border-bottom: 1px dashed #D1D6DB; flex-shrink: 0">
    <a href="Camera.dc.html" aria-label="뒤로" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <span style="width: 22px; height: 22px; border-radius: 6px; background: #E5E8EB"></span>
    <span style="font-size: 15px; font-weight: 700; flex: 1">눈맞춤</span>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="#4E5968" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4E5968" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
  </div>

  <div style="padding: 20px 24px 16px; display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-size: 22px; line-height: 1.4; font-weight: 800">6개월 아기의 눈으로 찍었어요</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #4E5968">6개월쯤엔 색을 어른과 비슷하게 보고, 거리감도 생기기 시작해요.</p>
  </div>

  <div style="margin: 0 20px; border-radius: 20px; overflow: hidden; background: #F2F4F6">
    <img src="/_blob/9a8871d44fad48af9d2f6323f4a49561" alt="6개월 아기의 눈으로 본 사진" style="display: block; width: 350px; height: 233px; object-fit: cover">
  </div>
  <p style="margin: 12px 24px 0; font-size: 13px; line-height: 1.55; color: #4E5968">비교선이나 글자 없이 이 사진 한 장만 앨범에 저장돼요.</p>

  <div style="flex: 1"></div>

  <sc-if value="{{saved}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="margin: 0 20px 12px; padding: 12px 16px; border-radius: 14px; background: #191F28; color: #FFFFFF; font-size: 14px; font-weight: 500">앨범에 저장했어요</div>
  </sc-if>
  <div style="padding: 0 20px 24px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
    <a href="Camera.dc.html" style="height: 56px; border-radius: 16px; background: #F2F4F6; color: #333D4B; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center">다시 찍기</a>
    <button onClick="{{save}}" style="height: 56px; border-radius: 16px; border: 0; background: {{primary}}; color: {{onPrimary}}; font-size: 16px; font-weight: 700">앨범에 저장하기</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"primary":{"editor":"color","default":"#2272EB","options":["#2272EB","#FFC21A","#4E46DC"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { saved: false };
  }
  renderVals() {
    const primary = this.props.primary ?? '#2272EB';
    return {
      primary,
      onPrimary: primary.toUpperCase() === '#FFC21A' ? '#191F28' : '#FFFFFF',
      saved: this.state.saved,
      save: () => this.setState({ saved: true })
    };
  }
}
</script>
</body>
</html>
